<body class="bg-surface-dim min-h-screen font-body-lg text-on-surface antialiased flex justify-center">
<!-- Mobile Device Container -->
<main class="w-full max-w-md bg-surface h-[100dvh] flex flex-col relative overflow-hidden shadow-2xl">
<!-- Top App Bar (Task Context - Back Button) -->
<header class="flex items-center px-md h-14 w-full bg-surface sticky top-0 z-20 shadow-[0_1px_0_0_rgba(255,255,255,0.05)]">
<button class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center hover:bg-surface-variant/50 interactive transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="ml-2 font-title-md text-title-md text-on-surface">Tambah Transaksi</h1>
<div class="flex-1"></div>
<!-- Optional action or spacing to balance header -->
</header>
<!-- Scrollable Form Area -->
<div class="flex-1 overflow-y-auto no-scrollbar px-md py-lg pb-32"><div class="mb-lg flex items-center space-x-3 p-md bg-tertiary/10 border border-tertiary/30 rounded-xl">
<span class="material-symbols-outlined text-tertiary">check_circle</span>
<span class="text-body-md text-on-surface font-medium">AI: Data berhasil diekstrak dari nota</span>
</div>
<!-- Nominal Input -->
<div class="flex flex-col items-center justify-center mt-sm mb-lg">
<span class="font-label-md text-label-md text-on-surface-variant tracking-widest mb-xs">NOMINAL</span>
<div class="flex items-center justify-center text-error" id="currency-symbol-container">
<span class="font-headline-lg-mobile text-headline-lg-mobile mr-2">Rp</span>
<input autofocus="" class="bg-transparent border-none p-0 w-[200px] text-center font-display-lg text-display-lg text-on-surface focus:ring-0 placeholder-on-surface-variant/30 appearance-none" placeholder="0" type="number" value="1250000"/>
</div>
</div><div class="flex justify-center -mt-6 mb-lg">
<button class="flex items-center space-x-1.5 px-3 py-1 rounded-full bg-primary-container text-primary border border-primary/20 hover:bg-primary/20 transition-colors interactive">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span>
<span class="text-label-sm font-label-sm uppercase tracking-wider">Scan Nota untuk isi otomatis</span>
</button>
</div>
<!-- Transaction Type Segmented Control -->
<div class="flex bg-surface-container rounded-full p-1 border border-surface-container-highest mb-lg relative">
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-error/15 rounded-full transition-transform duration-300 ease-in-out" id="segment-indicator"></div>
<button class="flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 text-error font-label-md text-label-md relative z-10 interactive" id="btn-expense">
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_downward</span>
<span class="">Pengeluaran</span>
</button>
<button class="flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 text-on-surface-variant hover:text-on-surface font-label-md text-label-md relative z-10 interactive transition-colors" id="btn-income">
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_upward</span>
<span class="">Pemasukan</span>
</button>
</div>
<div class="space-y-sm">
<!-- Project Field -->
<div class="bg-surface-container-highest rounded-t-lg border-b-2 border-outline-variant px-md pt-3 pb-2 relative group focus-within:border-primary transition-colors">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-1 group-focus-within:text-primary transition-colors">Project</label>
<select class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface focus:ring-0 appearance-none"><option class="text-on-surface-variant" disabled="" value="">Pilih Project...</option><option selected="" value="srv">Pengadaan Server Data Center</option><option value="mkt">Marketing Q4</option><option value="rnd">R&amp;D AI Core</option></select>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">arrow_drop_down</span>
</div>
<!-- Category Field -->
<div class="bg-surface-container-highest rounded-t-lg border-b-2 border-outline-variant px-md pt-3 pb-2 relative group focus-within:border-primary transition-colors">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-1 group-focus-within:text-primary transition-colors">Kategori</label>
<select class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface focus:ring-0 appearance-none"><option class="text-on-surface-variant" disabled="" value="">Pilih Kategori...</option><option value="op">Operasional</option><option selected="" value="it">IT &amp; Tech</option><option value="hr">HR &amp; Payroll</option></select>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">arrow_drop_down</span>
</div>
<!-- Account Field -->
<div class="bg-surface-container-highest rounded-t-lg border-b-2 border-outline-variant px-md pt-3 pb-2 relative group focus-within:border-primary transition-colors">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-1 group-focus-within:text-primary transition-colors">Rekening Sumber</label>
<select class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface focus:ring-0 appearance-none">
<option value="bca">BCA Corporate - 892xxxxx</option>
<option value="mdr">Mandiri Giro - 104xxxxx</option>
<option value="csh">Petty Cash HQ</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">arrow_drop_down</span>
</div>
<!-- Date Picker -->

<label class="font-label-sm text-label-sm text-on-surface-variant block mb-1 group-focus-within:text-primary transition-colors">Tanggal Transaksi</label>

<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">calendar_today</span>

<div class="w-full h-0.5 bg-primary/50 shadow-[0_0_10px_rgba(185,199,228,0.8)] absolute top-0 animate-[scan_2s_linear_infinite]"></div>

</div>

<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 text-center">Format JPG, PNG atau PDF<br/>Maksimal 5MB</span>
<button class="mt-4 flex items-center space-x-2 px-4 py-2 rounded-full bg-tertiary-container text-tertiary border border-tertiary/20 hover:bg-tertiary/20 transition-all interactive z-10">
<span class="material-symbols-outlined text-[20px]">auto_fix_high</span>
<span class="font-label-md font-semibold tracking-wide uppercase">AI Scan</span>
</button>
</div></div>
</div>
<!-- Fixed Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-md bg-surface border-t border-surface-container-low shadow-[0_-4px_20px_rgba(0,0,0,0.3)] z-20 pb-8 md:pb-md">
<button class="w-full h-12 bg-primary text-on-primary rounded-full font-title-md text-title-md flex items-center justify-center space-x-2 hover:opacity-90 interactive transition-all shadow-md">
<span class="material-symbols-outlined">save</span>
<span class="">Simpan Transaksi</span>
</button>
</div>
</main>
<!-- UI Logic Script -->
<script>
        // Segmented control logic for Expense vs Income
        const btnExpense = document.getElementById('btn-expense');
        const btnIncome = document.getElementById('btn-income');
        const indicator = document.getElementById('segment-indicator');
        const currencySymbolContainer = document.getElementById('currency-symbol-container');

        btnExpense.addEventListener('click', () => {
            // Move indicator left
            indicator.style.transform = 'translateX(0)';
            indicator.className = 'absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-error/15 rounded-full transition-transform duration-300 ease-in-out';
            
            // Text styling
            btnExpense.classList.add('text-error');
            btnExpense.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            btnIncome.classList.remove('text-secondary');
            btnIncome.classList.add('text-on-surface-variant', 'hover:text-on-surface');

            // Currency styling to match intent
            currencySymbolContainer.classList.remove('text-secondary');
            currencySymbolContainer.classList.add('text-error');
        });

        btnIncome.addEventListener('click', () => {
            // Move indicator right
            indicator.style.transform = 'translateX(100%)';
            indicator.className = 'absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-secondary/15 rounded-full transition-transform duration-300 ease-in-out';
            
            // Text styling
            btnIncome.classList.add('text-secondary');
            btnIncome.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
            btnExpense.classList.remove('text-error');
            btnExpense.classList.add('text-on-surface-variant', 'hover:text-on-surface');

            // Currency styling to match intent
            currencySymbolContainer.classList.remove('text-error');
            currencySymbolContainer.classList.add('text-secondary');
        });
    </script>
